<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="🍓 Timer">
<meta name="theme-color" content="#e8375a">
<meta name="description" content="可愛いいちごのポモドーロタイマー">
<title>🍓 Strawberry Timer</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --berry: #e8375a;
    --berry-dark: #c42044;
    --berry-light: #ffd6de;
    --berry-pale: #fff0f3;
    --leaf: #3aaa5e;
    --leaf-dark: #237a43;
    --break-bg: #fff5ed;
    --break-accent: #f07020;
    --long-bg: #fffbe8;
    --long-accent: #c8a000;
    --text: #2a1520;
    --text-sub: #8a6070;
    --card-bg: #fff8f9;
    --border: rgba(232,55,90,0.15);
    --radius: 24px;
    --radius-sm: 14px;
    --shadow: 0 8px 32px rgba(232,55,90,0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --berry-pale: #1a0a0e;
      --card-bg: #1f0d12;
      --text: #ffeef2;
      --text-sub: #c4909a;
      --border: rgba(232,55,90,0.2);
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--berry-pale);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
    transition: background 0.5s;
  }

  body.short-mode { background: var(--break-bg); }
  body.long-mode  { background: var(--long-bg); }

  .app {
    width: 100%;
    max-width: 420px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 40px;
    gap: 0;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-bottom: 28px;
  }
  .app-title {
    font-size: 22px;
    font-weight: 900;
    color: var(--berry);
    letter-spacing: -0.5px;
  }
  .settings-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .settings-btn:active { transform: scale(0.9); }

  /* Mode tabs */
  .mode-tabs {
    display: flex;
    gap: 6px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 36px;
    width: 100%;
    max-width: 320px;
  }
  .mode-btn {
    flex: 1;
    font-family: 'Nunito', sans-serif;
    font-size: 12px;
    font-weight: 800;
    border: none;
    background: transparent;
    color: var(--text-sub);
    padding: 8px 4px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.2px;
  }
  .mode-btn.active {
    background: var(--berry);
    color: #fff;
  }
  .mode-btn.active.short-active { background: var(--break-accent); }
  .mode-btn.active.long-active  { background: var(--long-accent); }

  /* Strawberry timer ring */
  .timer-area {
    position: relative;
    width: 240px;
    height: 240px;
    margin-bottom: 32px;
    flex-shrink: 0;
  }

  .ring-svg {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring-bg   { fill: none; stroke: var(--berry-light); stroke-width: 10; opacity: 0.4; }
  .ring-fill { fill: none; stroke: var(--berry); stroke-width: 10; stroke-linecap: round;
               transition: stroke-dashoffset 1s linear, stroke 0.5s; }

  .face {
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    box-shadow: var(--shadow);
    transition: background 0.5s;
  }

  .berry-icon {
    font-size: 52px;
    line-height: 1;
    transition: transform 0.3s;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08));
  }
  .berry-icon.pop { animation: pop 0.5s cubic-bezier(.36,.07,.19,.97); }

  @keyframes pop {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(1.25) rotate(-6deg); }
    60%  { transform: scale(0.95) rotate(4deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .time-text {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -2px;
    color: var(--text);
    line-height: 1;
  }
  .phase-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Session dots */
  .dots {
    display: flex;
    gap: 10px;
    margin-bottom: 36px;
  }
  .dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--berry-light);
    border: 1.5px solid rgba(232,55,90,0.2);
    transition: all 0.3s;
  }
  .dot.done {
    background: var(--berry);
    border-color: var(--berry-dark);
    transform: scale(1.1);
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 36px;
  }
  .icon-btn {
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(232,55,90,0.07);
  }
  .icon-btn:active { transform: scale(0.9); }

  .play-btn {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: none;
    background: var(--berry);
    color: #fff;
    font-size: 30px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(232,55,90,0.35);
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .play-btn:active { transform: scale(0.93); box-shadow: 0 4px 12px rgba(232,55,90,0.3); }
  .play-btn.short-mode { background: var(--break-accent); box-shadow: 0 8px 24px rgba(240,112,32,0.35); }
  .play-btn.long-mode  { background: var(--long-accent);  box-shadow: 0 8px 24px rgba(200,160,0,0.35); }

  /* Stats */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    width: 100%;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    text-align: center;
  }
  .stat-num  { font-size: 24px; font-weight: 900; color: var(--berry); }
  .stat-lbl  { font-size: 11px; font-weight: 700; color: var(--text-sub); margin-top: 2px; }

  /* Message */
  .message {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-sub);
    text-align: center;
    min-height: 22px;
    transition: opacity 0.4s;
  }

  /* Settings panel */
  .settings-panel {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .settings-panel.open { opacity: 1; pointer-events: all; }

  .settings-sheet {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: var(--card-bg);
    border-radius: 28px 28px 0 0;
    padding: 24px 24px calc(env(safe-area-inset-bottom, 0) + 24px);
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(.32,.72,0,1);
  }
  .settings-panel.open .settings-sheet { transform: translateY(0); }

  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 20px;
  }
  .sheet-title { font-size: 18px; font-weight: 900; margin-bottom: 20px; color: var(--text); }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-lbl { font-size: 15px; font-weight: 700; color: var(--text); }
  .setting-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

  .num-control {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .num-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--berry-pale);
    font-size: 18px;
    font-weight: 900;
    color: var(--berry);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .num-btn:active { transform: scale(0.9); }
  .num-val { font-size: 17px; font-weight: 900; color: var(--text); min-width: 28px; text-align: center; }

  /* BGM selector */
  .bgm-chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .bgm-chip {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 800;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 7px 14px;
    background: var(--berry-pale);
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .bgm-chip:active { transform: scale(0.93); }
  .bgm-chip.active-silent { background: #ede8ff; border-color: #9b7fea; color: #5b37c4; }
  .bgm-chip.active-clock  { background: #e8f5e9; border-color: #5aaa6a; color: #1e6b30; }
  .bgm-chip.active-music  { background: #e8f0ff; border-color: #5a80e8; color: #1e3db0; }

  /* Volume slider */
  .vol-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vol-row input[type=range] {
    flex: 1;
    accent-color: var(--berry);
    height: 4px;
  }
  .vol-label { font-size: 13px; font-weight: 700; color: var(--text-sub); min-width: 32px; text-align: right; }

  /* Install banner */
  .install-banner {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0) + 16px);
    left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px);
    max-width: 380px;
    background: var(--berry);
    color: #fff;
    border-radius: var(--radius-sm);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 28px rgba(232,55,90,0.4);
    z-index: 99;
    font-size: 14px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
    transform: translateX(-50%) translateY(20px);
  }
  .install-banner.show { opacity: 1; pointer-events: all; transform: translateX(-50%) translateY(0); }
  .install-banner .i-btn {
    margin-left: auto;
    background: rgba(255,255,255,0.25);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 13px;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .install-banner .close-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
  }
</style>
</head>
<body>

<div class="app" role="main">
  <div class="header">
    <div class="app-title">🍓 Strawberry Timer</div>
    <button class="settings-btn" onclick="openSettings()" aria-label="設定">⚙️</button>
  </div>

  <div class="mode-tabs" role="tablist">
    <button class="mode-btn active" role="tab" onclick="setMode('focus')">集中</button>
    <button class="mode-btn" role="tab" onclick="setMode('short')">短い休憩</button>
    <button class="mode-btn" role="tab" onclick="setMode('long')">長い休憩</button>
  </div>

  <div class="timer-area" aria-live="polite" aria-label="タイマー">
    <svg class="ring-svg" viewBox="0 0 240 240">
      <circle class="ring-bg" cx="120" cy="120" r="108"/>
      <circle class="ring-fill" id="ring" cx="120" cy="120" r="108"
        stroke-dasharray="678.6" stroke-dashoffset="0"/>
    </svg>
    <div class="face" id="face">
      <div class="berry-icon" id="berry">🍓</div>
      <div class="time-text" id="timeText">25:00</div>
      <div class="phase-label" id="phaseLabel">集中タイム</div>
    </div>
  </div>

  <div class="dots" id="dots" aria-label="完了セッション"></div>

  <div class="controls">
    <button class="icon-btn" onclick="resetTimer()" aria-label="リセット">↺</button>
    <button class="play-btn" id="playBtn" onclick="toggleTimer()" aria-label="スタート・停止">▶</button>
    <button class="icon-btn" onclick="skipSession()" aria-label="スキップ">⏭</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-num" id="statCompleted">0</div>
      <div class="stat-lbl">完了 🍓</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statStreak">0</div>
      <div class="stat-lbl">連続 🔥</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="statTime">0</div>
      <div class="stat-lbl">分集中 ⏱</div>
    </div>
  </div>

  <div class="message" id="message">さあ、始めましょう！🍓</div>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settingsPanel" onclick="maybeCloseSettings(event)">
  <div class="settings-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">⚙️ 設定</div>

    <div class="setting-row">
      <div>
        <div class="setting-lbl">集中時間</div>
        <div class="setting-sub">分</div>
      </div>
      <div class="num-control">
        <button class="num-btn" onclick="adjustTime('focus', -5)">−</button>
        <div class="num-val" id="setFocus">25</div>
        <button class="num-btn" onclick="adjustTime('focus', 5)">＋</button>
      </div>
    </div>

    <div class="setting-row">
      <div>
        <div class="setting-lbl">短い休憩</div>
        <div class="setting-sub">分</div>
      </div>
      <div class="num-control">
        <button class="num-btn" onclick="adjustTime('short', -1)">−</button>
        <div class="num-val" id="setShort">5</div>
        <button class="num-btn" onclick="adjustTime('short', 1)">＋</button>
      </div>
    </div>

    <div class="setting-row">
      <div>
        <div class="setting-lbl">長い休憩</div>
        <div class="setting-sub">分</div>
      </div>
      <div class="num-control">
        <button class="num-btn" onclick="adjustTime('long', -5)">−</button>
        <div class="num-val" id="setLong">15</div>
        <button class="num-btn" onclick="adjustTime('long', 5)">＋</button>
      </div>
    </div>

    <div class="setting-row">
      <div>
        <div class="setting-lbl">サウンド通知</div>
        <div class="setting-sub">セッション終了時</div>
      </div>
      <button class="num-btn" id="soundToggle" onclick="toggleSound()" style="width:52px;border-radius:12px;font-size:14px;">🔔 ON</button>
    </div>

    <div class="setting-row" style="flex-direction:column; align-items:flex-start; gap:10px;">
      <div class="setting-lbl">集中BGM</div>
      <div class="bgm-chips">
        <button class="bgm-chip" id="bgm-silent" onclick="setBgm('silent')">🔇 無音</button>
        <button class="bgm-chip" id="bgm-clock"  onclick="setBgm('clock')">🕰 時計の刻み音</button>
        <button class="bgm-chip" id="bgm-music"  onclick="setBgm('music')">🎵 オルゴール</button>
      </div>
    </div>

    <div class="setting-row" style="flex-direction:column; align-items:flex-start; gap:8px;">
      <div class="setting-lbl">BGM音量</div>
      <div class="vol-row" style="width:100%;">
        <span>🔈</span>
        <input type="range" id="volSlider" min="0" max="100" value="50" oninput="setVolume(this.value)">
        <span>🔊</span>
        <span class="vol-label" id="volLabel">50%</span>
      </div>
    </div>
  </div>
</div>

<!-- Install banner -->
<div class="install-banner" id="installBanner">
  <span>🍓 ホーム画面に追加できます</span>
  <button class="i-btn" id="installBtn">追加</button>
  <button class="close-btn" onclick="dismissInstall()">✕</button>
</div>

<script>
const CIRC = 2 * Math.PI * 108;

let settings = {
  focus: parseInt(localStorage.getItem('s_focus') || '25'),
  short: parseInt(localStorage.getItem('s_short') || '5'),
  long:  parseInt(localStorage.getItem('s_long')  || '15'),
  sound: localStorage.getItem('s_sound') !== 'off',
  bgm:   localStorage.getItem('s_bgm') || 'silent',
  vol:   parseInt(localStorage.getItem('s_vol') || '50')
};

// BGM state
let _bgmNodes = null; // { gainNode, stopFn }


let mode = 'focus';
let remaining = settings.focus * 60;
let running = false;
let interval = null;
let completed = parseInt(localStorage.getItem('completed') || '0');
let streak = parseInt(localStorage.getItem('streak') || '0');
let totalMinutes = parseInt(localStorage.getItem('totalMin') || '0');
let focusStarted = 0;

const EMOJIS = { focus: '🍓', short: '🍊', long: '🍌' };
const COLORS = { focus: '#e8375a', short: '#f07020', long: '#c8a000' };
const LABELS = { focus: '集中タイム', short: '短い休憩', long: '長い休憩' };
const MSGS_FOCUS = ['集中しましょう！📚','いい調子！💪','頑張れ！✨','もう少し！🎯','集中モード 🔥'];
const MSGS_BREAK = ['よく頑張りました！🎉','ゆっくり休んで💆','水分補給しましょう☕','目を休めて👁️','ストレッチしよう🧘'];

function fmt(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

function updateRing() {
  const total = settings[mode] * 60;
  const pct = remaining / total;
  document.getElementById('ring').style.strokeDashoffset = CIRC * (1 - pct);
  document.getElementById('ring').style.stroke = COLORS[mode];
}

function renderDots() {
  const d = document.getElementById('dots');
  d.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const el = document.createElement('div');
    el.className = 'dot' + (i < completed % 4 ? ' done' : (completed > 0 && completed % 4 === 0 && i < 4 ? ' done' : ''));
    d.appendChild(el);
  }
}

function render() {
  document.getElementById('timeText').textContent = fmt(remaining);
  document.getElementById('berry').textContent = EMOJIS[mode];
  document.getElementById('phaseLabel').textContent = LABELS[mode];
  document.getElementById('statCompleted').textContent = completed;
  document.getElementById('statStreak').textContent = streak;
  document.getElementById('statTime').textContent = totalMinutes;
  updateRing();
  renderDots();

  const body = document.body;
  body.className = mode === 'short' ? 'short-mode' : mode === 'long' ? 'long-mode' : '';

  const pb = document.getElementById('playBtn');
  pb.className = 'play-btn' + (mode === 'short' ? ' short-mode' : mode === 'long' ? ' long-mode' : '');

  const tabs = document.querySelectorAll('.mode-btn');
  tabs.forEach((b, i) => {
    const m = ['focus','short','long'][i];
    b.className = 'mode-btn' + (m === mode ? ' active' + (m !== 'focus' ? ' '+(m)+'-active' : '') : '');
  });
}

function pop() {
  const b = document.getElementById('berry');
  b.classList.remove('pop');
  void b.offsetWidth;
  b.classList.add('pop');
}

function setMode(m) {
  if (running) { clearInterval(interval); running = false; }
  stopBgm();
  mode = m;
  remaining = settings[m] * 60;
  document.getElementById('playBtn').textContent = '▶';
  render();
  document.getElementById('message').textContent = m === 'focus' ? 'さあ、始めましょう！🍓' : 'リラックスタイム 🌸';
}

function toggleTimer() {
  if (running) {
    clearInterval(interval);
    running = false;
    stopBgm();
    document.getElementById('playBtn').textContent = '▶';
    if (mode === 'focus') {
      const mins = Math.floor((settings.focus * 60 - remaining) / 60);
      totalMinutes += mins;
      localStorage.setItem('totalMin', totalMinutes);
    }
    document.getElementById('message').textContent = '一時停止中 ⏸️';
  } else {
    // AudioContextをユーザー操作時にアンロック
    try { const ctx = getAudioCtx(); if (ctx.state === 'suspended') ctx.resume(); } catch(e) {}
    running = true;
    document.getElementById('playBtn').textContent = '⏸';
    pop();
    const msgs = mode !== 'focus' ? MSGS_BREAK : MSGS_FOCUS;
    document.getElementById('message').textContent = msgs[Math.floor(Math.random() * msgs.length)];
    focusStarted = remaining;
    // 集中タイムのみBGM開始
    if (mode === 'focus') startBgm();
    interval = setInterval(() => {
      remaining--;
      document.getElementById('timeText').textContent = fmt(remaining);
      updateRing();
      document.title = fmt(remaining) + ' | 🍓 Timer';
      // 最後3秒: ビープ音
      if (remaining > 0 && remaining <= 3) playBeep(remaining);
      if (remaining <= 0) finish();
    }, 1000);
  }
}

function finish() {
  clearInterval(interval);
  running = false;
  stopBgm();
  pop();
  playChime();
  document.getElementById('playBtn').textContent = '▶';

  if (mode === 'focus') {
    const mins = Math.floor(settings.focus * 60 / 60);
    totalMinutes += mins;
    completed++;
    streak++;
    localStorage.setItem('totalMin', totalMinutes);
    localStorage.setItem('completed', completed);
    localStorage.setItem('streak', streak);
    document.getElementById('message').textContent = '集中セッション完了！お疲れ様です 🎉';
    render();
    // 集中終了 → 短い休憩へ自動切り替え（長い休憩は手動）
    setTimeout(() => setMode('short'), 900);
  } else if (mode === 'short') {
    document.getElementById('message').textContent = '休憩終了！また頑張りましょう 🍓';
    setTimeout(() => setMode('focus'), 900);
  } else {
    // long break: 手動スタートに戻すだけ
    document.getElementById('message').textContent = 'リフレッシュ完了！🍈';
    setTimeout(() => setMode('focus'), 900);
  }
}

function resetTimer() {
  clearInterval(interval);
  running = false;
  stopBgm();
  remaining = settings[mode] * 60;
  document.getElementById('playBtn').textContent = '▶';
  document.title = '🍓 Strawberry Timer';
  render();
  document.getElementById('message').textContent = 'リセットしました ↺';
}

function skipSession() {
  clearInterval(interval);
  running = false;
  remaining = 0;
  finish();
}

/* ── BGM functions ── */

function getBgmGain(ctx) {
  const g = ctx.createGain();
  g.gain.value = settings.vol / 100 * 0.4; // max 0.4
  g.connect(ctx.destination);
  return g;
}

function startClockBgm(ctx) {
  const gainNode = getBgmGain(ctx);
  let nextTick = ctx.currentTime + 0.05;
  const INTERVAL = 0.9;
  let tickPhase = 0;
  const id = setInterval(() => {
    if (!_bgmNodes) { clearInterval(id); return; }
    const now = ctx.currentTime;
    if (nextTick < now) nextTick = now + 0.01;
    // tick (高め) / tock (低め) 交互
    const freq = tickPhase % 2 === 0 ? 1100 : 880;
    const osc = ctx.createOscillator();
    const env = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    osc.connect(env);
    env.connect(gainNode);
    env.gain.setValueAtTime(0, nextTick);
    env.gain.linearRampToValueAtTime(1, nextTick + 0.005);
    env.gain.exponentialRampToValueAtTime(0.001, nextTick + 0.07);
    osc.start(nextTick);
    osc.stop(nextTick + 0.08);
    nextTick += INTERVAL;
    tickPhase++;
  }, 400);
  return { gainNode, stopFn: () => clearInterval(id) };
}

function startMusicBgm(ctx) {
  const gainNode = getBgmGain(ctx);
  const C4=261.63, D4=293.66, E4=329.63, F4=349.23, G4=392.00, A4=440.00, B4=493.88, C5=523.25;
  // キラキラ星（Twinkle Twinkle）
  const MELODY = [
    C4,C4,G4,G4,A4,A4,G4,0,
    F4,F4,E4,E4,D4,D4,C4,0,
    G4,G4,F4,F4,E4,E4,D4,0,
    G4,G4,F4,F4,E4,E4,D4,0,
    C4,C4,G4,G4,A4,A4,G4,0,
    F4,F4,E4,E4,D4,D4,C4,0
  ];
  const DUR = 0.5;
  let step = 0;
  let nextNote = ctx.currentTime + 0.05;
  let oscs = [];
  const id = setInterval(() => {
    if (!_bgmNodes) { clearInterval(id); return; }
    const now = ctx.currentTime;
    // 数ステップ先をスケジュール
    while (nextNote < now + 1.5 && step < MELODY.length * 8) {
      const freq = MELODY[step % MELODY.length];
      if (freq > 0) {
        [1, 2].forEach(harm => {
          const osc = ctx.createOscillator();
          const env = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq * harm;
          osc.connect(env);
          env.connect(gainNode);
          const vol = harm === 1 ? 1 : 0.3;
          env.gain.setValueAtTime(0, nextNote);
          env.gain.linearRampToValueAtTime(vol, nextNote + 0.04);
          env.gain.exponentialRampToValueAtTime(0.001, nextNote + DUR * 0.95);
          osc.start(nextNote);
          osc.stop(nextNote + DUR);
          oscs.push(osc);
        });
      }
      nextNote += DUR;
      step++;
      if (step % MELODY.length === 0) nextNote += DUR; // 1小節休符
    }
  }, 300);
  return { gainNode, stopFn: () => { clearInterval(id); oscs.forEach(o => { try { o.stop(); } catch(e){} }); }};
}

function startBgm() {
  stopBgm();
  if (settings.bgm === 'silent') return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    _bgmNodes = settings.bgm === 'clock' ? startClockBgm(ctx) : startMusicBgm(ctx);
  } catch(e) {}
}

function stopBgm(fadeDur = 0.3) {
  if (!_bgmNodes) return;
  const nodes = _bgmNodes;
  _bgmNodes = null;
  try {
    const ctx = getAudioCtx();
    nodes.gainNode.gain.setValueAtTime(nodes.gainNode.gain.value, ctx.currentTime);
    nodes.gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + fadeDur);
    setTimeout(() => { try { nodes.gainNode.disconnect(); } catch(e){} nodes.stopFn(); }, fadeDur * 1000 + 100);
  } catch(e) { nodes.stopFn(); }
}

function setBgm(type) {
  settings.bgm = type;
  localStorage.setItem('s_bgm', type);
  updateBgmChips();
  // 集中中なら即切り替え
  if (running && mode === 'focus') startBgm();
  else if (!running || mode !== 'focus') stopBgm();
}

function setVolume(val) {
  settings.vol = parseInt(val);
  localStorage.setItem('s_vol', settings.vol);
  document.getElementById('volLabel').textContent = settings.vol + '%';
  // リアルタイムにgainを変更
  if (_bgmNodes) {
    try {
      _bgmNodes.gainNode.gain.value = settings.vol / 100 * 0.4;
    } catch(e) {}
  }
}

function updateBgmChips() {
  ['silent','clock','music'].forEach(t => {
    const el = document.getElementById('bgm-' + t);
    if (el) el.className = 'bgm-chip' + (settings.bgm === t ? ' active-' + t : '');
  });
}

function getAudioCtx() {
  if (!window._audioCtx || window._audioCtx.state === 'closed') {
    window._audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return window._audioCtx;
}

function playBeep(secondsLeft) {
  if (!settings.sound) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    // 3→高め, 2→中, 1→低め で変化
    osc.frequency.value = secondsLeft === 3 ? 880 : secondsLeft === 2 ? 784 : 660;
    osc.type = 'sine';
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(0.15, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    osc.start(t); osc.stop(t + 0.25);
  } catch(e) {}
}

function playChime() {
  if (!settings.sound) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    // モードによって終了音を変える
    const isFocus = mode === 'focus';
    const freqs = isFocus
      ? [523, 659, 784, 1047]    // 集中終了: 明るく上昇
      : mode === 'long'
        ? [784, 622, 523, 466]   // 長い休憩終了: マイナー調（G・Eb・C・Bb）
        : [784, 659, 523, 392];  // 短い休憩終了: 明るく下降（G・E・C・A）
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      const t = ctx.currentTime + i * 0.22;
      gain.gain.setValueAtTime(0.0, t);
      gain.gain.linearRampToValueAtTime(0.2, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      osc.start(t); osc.stop(t + 0.6);
    });
  } catch(e) {}
}

function openSettings() {
  document.getElementById('settingsPanel').classList.add('open');
  document.getElementById('setFocus').textContent = settings.focus;
  document.getElementById('setShort').textContent = settings.short;
  document.getElementById('setLong').textContent = settings.long;
  document.getElementById('soundToggle').textContent = settings.sound ? '🔔 ON' : '🔕 OFF';
  document.getElementById('volSlider').value = settings.vol;
  document.getElementById('volLabel').textContent = settings.vol + '%';
  updateBgmChips();
}

function maybeCloseSettings(e) {
  if (e.target === document.getElementById('settingsPanel')) {
    document.getElementById('settingsPanel').classList.remove('open');
  }
}

function adjustTime(key, delta) {
  const min = key === 'short' ? 1 : 5;
  const max = key === 'short' ? 30 : 60;
  settings[key] = Math.min(max, Math.max(min, settings[key] + delta));
  localStorage.setItem('s_' + key, settings[key]);
  document.getElementById('set' + key.charAt(0).toUpperCase() + key.slice(1)).textContent = settings[key];
  if (mode === key && !running) {
    remaining = settings[key] * 60;
    document.getElementById('timeText').textContent = fmt(remaining);
    updateRing();
  }
}

function toggleSound() {
  settings.sound = !settings.sound;
  localStorage.setItem('s_sound', settings.sound ? 'on' : 'off');
  document.getElementById('soundToggle').textContent = settings.sound ? '🔔 ON' : '🔕 OFF';
}

function dismissInstall() {
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('installDismissed', '1');
}

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!localStorage.getItem('installDismissed')) {
    setTimeout(() => document.getElementById('installBanner').classList.add('show'), 2000);
  }
});

document.getElementById('installBtn').addEventListener('click', () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      dismissInstall();
    });
  } else {
    alert('Safariの場合：「共有」→「ホーム画面に追加」をタップしてください 🍓');
    dismissInstall();
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();
updateBgmChips();
</script>
